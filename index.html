<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Rhett | Home Team Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #05070a;
            --denim: #111827;
            --copper: #c27856;
            --cream: #f8f5f2;
            --discount-text: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--cream);
            background-image: radial-gradient(circle at top right, #1a2333 0%, transparent 50%);
            margin: 0; padding: 20px;
        }

        .container { max-width: 650px; margin: 0 auto; text-align: center; }

        /* --- THE IMAGE FIX --- */
        .profile-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            position: relative;
        }
        .profile-badge {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--copper);
            object-fit: cover; /* Keeps image from stretching */
            background-color: #1a2333; /* Fallback color if image fails */
            display: block;
            box-shadow: 0 0 30px rgba(194, 120, 86, 0.4);
        }

        .order-panel {
            background: var(--denim);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 35px;
            text-align: left;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .section-label { font-size: 0.7rem; font-weight: 800; color: var(--copper); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }

        .tier-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tier-card.active { border-color: var(--copper); background: rgba(194, 120, 86, 0.15); }

        .upsell-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-radius: 10px; margin-bottom: 8px;
            background: rgba(255,255,255,0.02); cursor: pointer;
        }
        .upsell-item.selected { border: 1px solid var(--copper); }

        .gift-card-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed var(--discount-text);
            padding: 15px; border-radius: 12px; margin: 20px 0;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }

        .total-display {
            background: #000; padding: 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--copper); margin-bottom: 20px;
        }

        input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #334155;
            border-radius: 10px; color: white; margin-bottom: 10px;
        }

        .btn-submit {
            width: 100%; background: var(--copper); color: white; padding: 18px;
            border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-container">
        <img src="./hero.jpg" alt="Home Team Elite" class="profile-badge">
    </div>

    <h1 style="font-family:'Playfair Display'; font-size: 2.2rem;">HOME TEAM SPACE</h1>
    <p style="color:var(--copper); letter-spacing:2px; font-size:0.8rem; margin-bottom:30px;">OFFICIAL 2026 FAN CONCIERGE</p>

    <div class="order-panel">
        <span class="section-label">Select Membership Tier</span>
        <div class="tier-card active" onclick="setBase(35, this)">
            <strong>Gold Fan Card</strong> — $35.00
            <p style="font-size:0.75rem; color:#94a3b8; margin:0;">Includes 2026 Stadium Tour Presale ID</p>
        </div>

        <span class="section-label" style="margin-top:20px;">Premium Add-ons</span>
        <div class="upsell-item" onclick="toggleAddon(150, this)">
            <span>Luke Combs Tour Sync</span>
            <span style="color:var(--copper); font-weight:800;">+$150</span>
        </div>
        <div class="upsell-item" onclick="toggleAddon(85, this)">
            <span>Signed 'About A Woman' Vinyl</span>
            <span style="color:var(--copper); font-weight:800;">+$85</span>
        </div>

        <div class="gift-card-box" onclick="toggleGC()">
            <input type="checkbox" id="gccheck">
            <label style="font-size:0.85rem; color:var(--discount-text); cursor:pointer;">
                <strong>Gift Card Discount (5% OFF)</strong><br>
                Steam / Amazon / Razer Gold
            </label>
        </div>

        <div class="total-display">
            <span style="font-size:0.8rem;">TOTAL DUE:</span>
            <span id="final-price" style="font-size:1.8rem; font-weight:800;">$35.00</span>
        </div>

        <input type="text" id="fname" placeholder="Full Legal Name">
        <input type="email" id="femail" placeholder="Email for Secure Invoice">
        <button class="btn-submit" onclick="submitOrder()">Request Secure Invoice</button>
    </div>
</div>

<script>
    let base = 35;
    let addons = 0;
    let discount = false;

    function setBase(p, el) { base = p; calc(); }
    
    function toggleAddon(p, el) {
        el.classList.toggle('selected');
        if(el.classList.contains('selected')) addons += p;
        else addons -= p;
        calc();
    }

    function toggleGC() {
        discount = !discount;
        document.getElementById('gccheck').checked = discount;
        calc();
    }

    function calc() {
        let total = base + addons;
        if(discount) total *= 0.95;
        document.getElementById('final-price').innerText = `$${total.toFixed(2)}`;
    }

    function submitOrder() {
        alert("Invoice request sent! Check your email for the secure payment portal.");
    }
</script>

</body>
</html>
